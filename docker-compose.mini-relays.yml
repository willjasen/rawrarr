# Internal relay endpoints in the Mini Tailscale network namespace.
# Start the Tailscale sidecar before this profile.
services:
  storage-proxy:
    image: rawrarr-coordinator-proxy:local
    container_name: rawrarr-mini-storage-proxy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    network_mode: "container:rawrarr-mini-tailscale"
    volumes:
      - ./storage-proxy.Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
