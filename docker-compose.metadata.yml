# Standalone subscriber deployment against an existing coordinator.
services:
  artwork-cache:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 2560m
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - metadata-private

  fossil:
    build:
      context: ./rust-arr
    image: rawrarr:local
    environment:
      RAWARR_ROLE: metadata
      RAWARR_UI_GITHUB_REPO: willjasen/rawrarr
      RAWARR_UI_GITHUB_TOKEN_FILE: /run/secrets/rawrarr_ui_github_token
      RUST_ARR_LISTEN_ADDR: 0.0.0.0:8080
      RAWARR_DATA_DIR: /data
      RAWARR_SHARED_DATA_DIR: /shared
      RAWARR_METADATA_DIR: /metadata
      RAWARR_NODE_ID: ${RAWARR_NODE_ID:?Set a stable, unique fossil node ID}
      RAWARR_DEVICE_ID: ${RAWARR_NODE_ID:?Set a stable, unique fossil node ID}
      RAWARR_DEVICE_NAME: ${RAWARR_DEVICE_NAME:-Fossil node}
      RAWARR_COORDINATOR_URL: ${RAWARR_COORDINATOR_URL:-https://swarmsail.willjasen.net}
      RAWARR_COORDINATOR_LOCAL_HTTP: ${RAWARR_COORDINATOR_LOCAL_HTTP:-false}
      RAWARR_NODE_TOKEN_FILE: /run/secrets/rawrarr_node_token
      RAWARR_NODE_ENROLLMENT_ENABLED: ${RAWARR_NODE_ENROLLMENT_ENABLED:-true}
      RAWARR_WEBAUTHN_RP_ID: ${RAWARR_WEBAUTHN_RP_ID:-localhost}
      RAWARR_WEBAUTHN_ORIGIN: ${RAWARR_WEBAUTHN_ORIGIN:-http://localhost:7297}
      RAWARR_LOCAL_PLAINTEXT_CONFIG: "false"
      RAWARR_ARTWORK_CACHE_ENABLED: ${RAWARR_ARTWORK_CACHE_ENABLED:-false}
      RAWARR_ARTWORK_CACHE_URL: redis://artwork-cache:6379/
      RAWARR_ARTWORK_CACHE_TTL_SECONDS: ${RAWARR_ARTWORK_CACHE_TTL_SECONDS:-86400}
      RAWARR_CONFIG_CACHE_URL: redis://artwork-cache:6379/
      RAWARR_CONFIG_PEERS: ${RAWARR_CONFIG_PEERS:-}
    volumes:
      - rawrarr-data:/data
      - rawrarr-ui:/ui
      - type: bind
        source: "${RAWARR_SHARED_DATA_PATH:-${HOME}/Library/Application Support/rawrarr/shared-data}"
        target: /shared
        bind:
          create_host_path: false
    restart: unless-stopped
    secrets:
      - rawrarr_ui_github_token
    networks:
      - default
      - metadata-private
    depends_on:
      artwork-cache:
        condition: service_healthy

networks:
  metadata-private:
    internal: true
volumes:
  rawrarr-data:
  rawrarr-ui:
secrets:
  rawrarr_ui_github_token:
    file: ${RAWARR_UI_GITHUB_TOKEN_PATH:?Set RAWARR_UI_GITHUB_TOKEN_PATH to a fine-grained read-only GitHub token file}
