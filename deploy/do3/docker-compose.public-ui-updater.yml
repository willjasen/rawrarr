# Add private GitHub UI bundle updates to the public roarlay coordinator.
services:
  roarlay:
    environment:
      RAWARR_UI_GITHUB_REPO: willjasen/rawrarr
      RAWARR_UI_GITHUB_TOKEN_FILE: /run/secrets/rawrarr_ui_github_token
    secrets:
      - rawrarr_ui_github_token
    volumes:
      - rawrarr-roarlay-prod-ui:/ui

volumes:
  rawrarr-roarlay-prod-ui:
    name: rawrarr-roarlay-prod-ui

secrets:
  rawrarr_ui_github_token:
    file: ${RAWARR_UI_GITHUB_TOKEN_PATH:-/root/gh-token}
