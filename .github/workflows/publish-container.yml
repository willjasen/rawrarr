name: Publish public container image

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-container-main
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            runner_arch: x86_64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            runner_arch: aarch64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.runner_arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish architecture image
        uses: docker/build-push-action@v6
        with:
          context: rust-arr
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}-${{ matrix.arch }}
          build-args: |
            RAWARR_BUILD_REVISION=${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=rawrarr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rawrarr-${{ matrix.arch }}

  publish-manifest:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Publish multi-architecture main and commit tags
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and publish multi-architecture tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:main" \
            --tag "$IMAGE:sha-$COMMIT_SHA" \
            "$IMAGE:sha-$COMMIT_SHA-amd64" \
            "$IMAGE:sha-$COMMIT_SHA-arm64"
