<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · rawrarr</title>
  <style>
    :root { color-scheme: dark; --bg:#101411; --panel:#171d19; --line:#29332c; --text:#edf3ec; --muted:#96a397; --green:#a6e3a1; --accent:#19251c; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
    main { width:min(100% - 32px,390px); padding:30px; background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:0 24px 80px #0005 }
    .brand { color:var(--green); font-size:13px; font-weight:750; letter-spacing:.08em; text-transform:uppercase }
    h1 { margin:28px 0 5px; font-size:27px; letter-spacing:-.04em }
    p { color:var(--muted); font-size:13px; margin:0 0 22px }
    label { display:block; margin:14px 0 6px; color:#c8d3c9; font-size:12px }
    input { width:100%; border:1px solid var(--line); border-radius:9px; padding:12px; color:var(--text); background:#111712; font:inherit }
    button { width:100%; margin-top:18px; border:1px solid #658968; border-radius:9px; padding:12px; color:#101711; background:var(--green); font:650 13px system-ui; cursor:pointer }
    button:disabled { opacity:.55; cursor:wait }
    #register-panel[hidden], #login-panel[hidden] { display:none }
    #message { min-height:22px; margin-top:14px; color:var(--muted); font-size:12px }
    .switch { display:block; width:auto; margin:14px auto 0; padding:4px 8px; border:0; color:var(--green); background:none; font:12px system-ui }
    .divider { height:1px; margin:20px 0; background:var(--line) }
  </style>
</head>
<body>
  <main>
    <div class="brand">rawrarr</div>
    <h1>Sign in</h1>
    <p>Use a passkey to continue to your private media workspace.</p>
    <section id="register-panel" hidden>
      <label for="new-username">Username</label>
      <input id="new-username" autocomplete="username" maxlength="32" placeholder="Your account name">
      <label for="display-name">Name</label>
      <input id="display-name" autocomplete="name" maxlength="64" placeholder="How rawrarr should address you">
      <button id="create-passkey" type="button">Create account with a passkey</button>
    </section>
    <section id="login-panel" hidden>
      <label for="username">Username</label>
      <input id="username" autocomplete="username webauthn" maxlength="32" placeholder="Your account name">
      <button id="sign-in" type="button">Continue with passkey</button>
    </section>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script type="module">
    import { decodeOptions } from '/assets/passkey-client.mjs';

    const message = document.getElementById('message');
    function encodeBase64Url(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }
    function credentialJson(credential) {
      const response = credential.response;
      const result = {
        id: credential.id,
        rawId: encodeBase64Url(credential.rawId),
        type: credential.type,
        response: { clientDataJSON: encodeBase64Url(response.clientDataJSON) },
        clientExtensionResults: credential.getClientExtensionResults()
      };
      if (response.attestationObject) {
        result.response.attestationObject = encodeBase64Url(response.attestationObject);
        if (response.getTransports) result.response.transports = response.getTransports();
      } else {
        result.response.authenticatorData = encodeBase64Url(response.authenticatorData);
        result.response.signature = encodeBase64Url(response.signature);
        result.response.userHandle = response.userHandle ? encodeBase64Url(response.userHandle) : null;
      }
      return result;
    }
    async function post(url, body) {
      const response = await fetch(url, {
        method: 'POST', headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Passkey sign-in failed');
      return data;
    }
    async function createPasskey() {
      const username = document.getElementById('new-username').value;
      const displayName = document.getElementById('display-name').value;
      const start = await post('/api/auth/register/start', { username, displayName });
      const credential = await navigator.credentials.create({ publicKey: decodeOptions(start.options) });
      const result = await post('/api/auth/register/finish', { challengeId: start.challengeId, credential: credentialJson(credential) });
      window.location.assign(result.next);
    }
    async function signIn() {
      const start = await post('/api/auth/login/start', { username: document.getElementById('username').value });
      const credential = await navigator.credentials.get({ publicKey: decodeOptions(start.options) });
      const result = await post('/api/auth/login/finish', { challengeId: start.challengeId, credential: credentialJson(credential) });
      window.location.assign(result.next);
    }
    async function run(button, action) {
      button.disabled = true;
      message.textContent = 'Waiting for your passkey…';
      try { await action(); }
      catch (error) { message.textContent = error.message || 'Passkey operation was cancelled.'; }
      finally { button.disabled = false; }
    }
    document.getElementById('create-passkey').addEventListener('click', event => run(event.currentTarget, createPasskey));
    document.getElementById('sign-in').addEventListener('click', event => run(event.currentTarget, signIn));
    (async () => {
      if (!window.PublicKeyCredential || !navigator.credentials) {
        message.textContent = 'This browser does not support passkeys.';
        return;
      }
      try {
        const response = await fetch('/api/auth/status', { headers: { Accept: 'application/json' } });
        const status = await response.json();
        document.getElementById(status.userExists ? 'login-panel' : 'register-panel').hidden = false;
      } catch (_) { message.textContent = 'Could not connect to the account service.'; }
    })();
  </script>
</body>
</html>
