[package]
name = "rust-arr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum = "0.8"
async-stream = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webauthn-rs = { version = "0.5.4", default-features = false, features = ["danger-allow-state-serialisation"] }
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"
