[package]
name = "rawrarr-stripe-service"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum = "0.8"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
uuid = "1"

[lints.rust]
unsafe_code = "forbid"
