# Standalone localhost-only sample admin preview; no coordinator is required.
# The web container has no database connection and publishes no public port.
services:
  admin:
    build:
      context: ./admin
    image: rawrarr-admin:local
    container_name: rawrarr-admin
    ports:
      - "127.0.0.1:7299:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
