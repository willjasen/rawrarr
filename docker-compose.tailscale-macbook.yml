# Dedicated MacBook Tailscale identity for the Rawrarr coordinator.
# Attach this service to the existing rawrarr-local_default network.
services:
  artwork-cache:
    image: valkey/valkey:8-alpine
    container_name: rawrarr-local-artwork-cache-1
    command: ["valkey-server", "--bind", "127.0.0.1", "--protected-mode", "yes", "--save", "", "--appendonly", "no", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 2560m
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_started

  tailscale:
    image: tailscale/tailscale:stable
    container_name: rawrarr-macbook-tailscale
    hostname: rawrarr
    environment:
      TS_HOSTNAME: rawrarr
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_SOCKS5_SERVER: ":1055"
    volumes:
      - "${RAWARR_TAILSCALE_STATE_PATH:-${HOME}/Library/Application Support/rawrarr/tailscale/macbook}:/var/lib/tailscale"
    ports:
      - "127.0.0.1:7297:8080"
      - "127.0.0.1:7298:8080"
    restart: unless-stopped
    networks:
      default:
        aliases:
          - coordinator
      coordinator-ingress:
        aliases:
          - coordinator

  roarlay:
    # Share the Tailscale namespace so Serve can proxy directly to the app on loopback.
    network_mode: "service:tailscale"
    ports: !reset []
    environment:
      RAWARR_NODE_RELAY_TARGETS: '{"macbook-metadata":"http://127.0.0.1:8081","mac-mini-storage":"https://rawrarr-mini.risk-mermaid.ts.net","macbook-storage":"http://127.0.0.1:8084"}'
      RAWARR_NODE_DIRECT_TARGETS: '{"macbook-metadata":"https://rawrarr.risk-mermaid.ts.net/direct-api/","mac-mini-storage":"https://rawrarr-mini.risk-mermaid.ts.net/direct-api/"}'

  fossil:
    # Keep the node reachable only to the coordinator sharing this network namespace.
    network_mode: "service:tailscale"
    ports: !reset []
    environment:
      RUST_ARR_LISTEN_ADDR: 127.0.0.1:8081
      RUST_ARR_DIRECT_LISTEN_ADDR: 127.0.0.1:8082
      RAWARR_ARTWORK_CACHE_ENABLED: ${RAWARR_ARTWORK_CACHE_ENABLED:-false}
      RAWARR_ARTWORK_CACHE_URL: redis://127.0.0.1:6379/
      RAWARR_ARTWORK_CACHE_TTL_SECONDS: ${RAWARR_ARTWORK_CACHE_TTL_SECONDS:-86400}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    depends_on:
      tailscale:
        condition: service_started
      artwork-cache:
        condition: service_healthy

networks:
  coordinator-ingress:
    name: swarmsail-rawrarr-ingress
    external: true
