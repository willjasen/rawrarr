# Internal-only Caddy front for the Tailscale Serve /analytics mount.
# Serve maps /analytics to 127.0.0.1:8081/analytics; / remains on roarlay at 8080.
services:
  umami:
    image: rawrarr-umami:559e3c607c23-basepath-analytics
    pull_policy: never
    container_name: rawrarr-int-umami

  umami-postgres:
    container_name: rawrarr-int-umami-postgres

  analytics-caddy:
    image: caddy:2-alpine
    container_name: rawrarr-int-caddy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./analytics-dashboard-internal.Caddyfile:/etc/caddy/Caddyfile:ro
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
      roarlay:
        condition: service_started
      umami:
        condition: service_started
    restart: unless-stopped
