# Dedicated Mac mini Tailscale identity for Rawrarr storage and coordinator relay.
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: rawrarr-mini-tailscale
    hostname: rawrarr-mini
    environment:
      TS_HOSTNAME: rawrarr-mini
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_SOCKS5_SERVER: ":1055"
    volumes:
      - "${RAWARR_TAILSCALE_STATE_PATH:-${HOME}/Library/Application Support/rawrarr/tailscale/mini}:/var/lib/tailscale"
    restart: unless-stopped
